<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameZone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🎮 GameRush</h1>
      <p>Play your games in one place.</p>
    </div>
    <input id="search" type="text" placeholder="Search games..." />
  </header>

  <main>
    <section class="hero">
      <div>
        <span class="badge">YOUR GAME HUB</span>
        <h2>Pick a game and start playing.</h2>
        <p>Add more games by putting their folders inside <b>/games</b> and adding them to <b>games.js</b>.</p>
      </div>
    </section>

    <section>
      <h3 class="section-title">Games</h3>
      <div id="gameGrid" class="game-grid"></div>
      <p id="emptyMessage" class="empty hidden">No games found.</p>
    </section>
  </main>

  <div id="playerModal" class="modal hidden" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-bar">
        <div>
          <strong id="playerTitle">Game</strong>
          <span id="playerCategory"></span>
        </div>
        <div class="actions">
          <button id="fullscreenBtn">⛶ Fullscreen</button>
          <button id="closeBtn">✕ Close</button>
        </div>
      </div>
      <iframe id="gameFrame" title="Game player" allow="fullscreen; autoplay; gamepad"></iframe>
    </div>
  </div>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
