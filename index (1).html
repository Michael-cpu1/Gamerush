<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Dodger</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050612;color:white;font-family:system-ui}
canvas{display:block;width:100%;height:100%}
#tip{position:fixed;top:14px;left:14px;background:#0008;padding:10px 13px;border-radius:12px}
</style>
</head>
<body>
<div id="tip">Move: ← → or A/D · Dodge the red blocks</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,keys={},player={x:0,y:0,w:45,h:45},obs=[],score=0,last=0,dead=false;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;player.y=H-80}
resize();addEventListener('resize',resize);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(dead&&e.key===' ')reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function reset(){obs=[];score=0;dead=false;player.x=W/2-player.w/2;last=performance.now()}
reset();
function loop(t){
 let dt=Math.min(.03,(t-last)/1000||0);last=t;
 if(!dead){
   let v=380;
   if(keys['arrowleft']||keys['a']) player.x-=v*dt;
   if(keys['arrowright']||keys['d']) player.x+=v*dt;
   player.x=Math.max(0,Math.min(W-player.w,player.x));
   if(Math.random()<dt*(1.3+score/25)) obs.push({x:Math.random()*(W-40),y:-50,w:30+Math.random()*35,h:30+Math.random()*35,s:180+Math.random()*170});
   for(const o of obs)o.y+=o.s*dt;
   obs=obs.filter(o=>o.y<H+80);
   for(const o of obs) if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y) dead=true;
   score+=dt;
 }
 x.clearRect(0,0,W,H);
 let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#090b25');g.addColorStop(1,'#07151f');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.shadowBlur=25;x.shadowColor='#32e6ff';x.fillStyle='#49eeff';x.fillRect(player.x,player.y,player.w,player.h);x.shadowBlur=0;
 x.fillStyle='#ff335f';for(const o of obs)x.fillRect(o.x,o.y,o.w,o.h);
 x.fillStyle='white';x.font='bold 24px system-ui';x.fillText('Score: '+Math.floor(score),20,70);
 if(dead){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='white';x.textAlign='center';x.font='bold 48px system-ui';x.fillText('GAME OVER',W/2,H/2);x.font='22px system-ui';x.fillText('Press SPACE to restart',W/2,H/2+48);x.textAlign='start'}
 requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
</script>
</body>
</html>
